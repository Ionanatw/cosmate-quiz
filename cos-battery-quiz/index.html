<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COS 最大電量是多少？</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --card-radius: 20px;
    --glow-cyan: #4ecdc4;
    --glow-pink: #ff6b6b;
    --glow-yellow: #ffe66d;
    --glow-purple: #a855f7;
    --glow-orange: #ff9f43;
    --bg-dark: #0f0f1a;
    --card-bg: #1a1a2e;
  }

  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-dark);
    color: #fff;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ============ SHARED CARD FRAME ============ */
  .card-frame {
    position: relative;
    width: 340px;
    max-width: 92vw;
    border-radius: var(--card-radius);
    background: var(--card-bg);
    border: 3px solid rgba(255,255,255,0.12);
    overflow: hidden;
    box-shadow:
      0 0 30px rgba(78, 205, 196, 0.15),
      0 20px 60px rgba(0,0,0,0.5);
  }
  .card-frame::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: var(--card-radius);
    padding: 3px;
    background: linear-gradient(135deg, var(--glow-cyan), var(--glow-pink), var(--glow-yellow), var(--glow-cyan));
    background-size: 300% 300%;
    animation: borderShimmer 4s ease infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes borderShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* ============ SCREEN CONTAINER ============ */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px 16px;
    animation: fadeIn 0.5s ease;
  }
  .screen.active { display: flex; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ COVER CARD ============ */
  .cover-card {
    padding: 0;
    text-align: center;
  }
  .cover-top {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 36px 28px 20px;
    position: relative;
  }
  .cover-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--glow-pink), var(--glow-orange));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 20px;
    letter-spacing: 1px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  /* Battery Icon */
  .battery-icon {
    position: relative;
    width: 120px;
    height: 200px;
    margin: 0 auto 20px;
  }
  .battery-body {
    width: 100px;
    height: 170px;
    border: 4px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    overflow: hidden;
    background: rgba(0,0,0,0.3);
  }
  .battery-tip {
    width: 40px;
    height: 14px;
    background: rgba(255,255,255,0.3);
    border-radius: 6px 6px 0 0;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
  }
  .battery-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65%;
    background: linear-gradient(0deg, var(--glow-pink), var(--glow-orange), var(--glow-yellow));
    border-radius: 0 0 10px 10px;
    animation: batteryPulse 2s ease-in-out infinite;
  }
  .battery-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
  }
  .battery-text {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    z-index: 2;
  }
  @keyframes batteryPulse {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 1; }
  }
  .battery-lightning {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    z-index: 3;
    filter: drop-shadow(0 0 10px rgba(255, 230, 109, 0.8));
    animation: lightningFlash 2.5s ease-in-out infinite;
  }
  @keyframes lightningFlash {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  }

  .cover-title {
    font-size: 26px;
    font-weight: 900;
    line-height: 1.3;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #fff, var(--glow-yellow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .cover-subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    line-height: 1.6;
    margin-bottom: 4px;
  }

  .cover-bottom {
    padding: 20px 28px 32px;
    background: linear-gradient(180deg, var(--card-bg), #12121f);
  }
  .cover-taglines {
    font-size: 12.5px;
    color: rgba(255,255,255,0.5);
    line-height: 1.8;
    margin-bottom: 24px;
  }

  .btn-start {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 900;
    font-family: inherit;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--glow-pink), var(--glow-orange));
    box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
    transition: all 0.2s;
    letter-spacing: 2px;
  }
  .btn-start:active {
    transform: scale(0.97);
    box-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
  }

  /* ============ QUESTION CARD ============ */
  .question-card {
    padding: 0;
  }
  .q-header {
    padding: 20px 24px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .q-number {
    font-size: 13px;
    font-weight: 700;
    color: var(--glow-cyan);
    letter-spacing: 1px;
  }
  .q-progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin-left: 14px;
    overflow: hidden;
  }
  .q-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--glow-cyan), var(--glow-pink));
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .q-body {
    padding: 24px 24px 8px;
  }
  .q-text {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 20px;
    min-height: 52px;
  }

  .q-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 24px 28px;
  }
  .q-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .q-option:active {
    transform: scale(0.97);
  }
  .q-option:hover {
    border-color: rgba(78, 205, 196, 0.3);
    background: rgba(78, 205, 196, 0.06);
  }
  .q-option.selected {
    border-color: var(--glow-cyan);
    background: rgba(78, 205, 196, 0.12);
    box-shadow: 0 0 15px rgba(78, 205, 196, 0.15);
  }
  .q-option-letter {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .q-option.selected .q-option-letter {
    background: var(--glow-cyan);
    color: var(--bg-dark);
  }
  .q-option-text {
    font-size: 14.5px;
    line-height: 1.4;
    color: rgba(255,255,255,0.8);
  }
  .q-option.selected .q-option-text {
    color: #fff;
  }

  /* ============ LOADING SCREEN ============ */
  .loading-content {
    text-align: center;
  }
  .loading-battery {
    width: 80px;
    height: 130px;
    margin: 0 auto 30px;
    position: relative;
  }
  .loading-battery .battery-body {
    width: 70px;
    height: 110px;
    border-width: 3px;
  }
  .loading-battery .battery-tip {
    width: 30px;
    height: 10px;
  }
  .loading-battery .battery-fill {
    animation: chargeFill 2.5s ease-in-out forwards;
  }
  @keyframes chargeFill {
    0% { height: 5%; }
    100% { height: 95%; }
  }
  .loading-text {
    font-size: 16px;
    font-weight: 700;
    color: var(--glow-cyan);
    animation: loadBlink 0.8s ease infinite;
  }
  @keyframes loadBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .loading-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
  }

  /* ============ RESULT CARD ============ */
  .result-card {
    padding: 0;
    text-align: center;
    overflow: visible;
  }

  /* Each tier gets unique colors */
  .result-card[data-tier="1"] { --tier-color: #8b9dc3; --tier-glow: rgba(139,157,195,0.4); --tier-gradient: linear-gradient(135deg, #667eea, #764ba2); }
  .result-card[data-tier="2"] { --tier-color: #4ecdc4; --tier-glow: rgba(78,205,196,0.4); --tier-gradient: linear-gradient(135deg, #11998e, #38ef7d); }
  .result-card[data-tier="3"] { --tier-color: #f7971e; --tier-glow: rgba(247,151,30,0.4); --tier-gradient: linear-gradient(135deg, #f7971e, #ffd200); }
  .result-card[data-tier="4"] { --tier-color: #ff6b6b; --tier-glow: rgba(255,107,107,0.4); --tier-gradient: linear-gradient(135deg, #ff6b6b, #ee5a24); }
  .result-card[data-tier="5"] { --tier-color: #a855f7; --tier-glow: rgba(168,85,247,0.4); --tier-gradient: linear-gradient(135deg, #f093fb, #f5576c); }

  .result-card::before {
    background: linear-gradient(135deg, var(--tier-color), var(--glow-yellow), var(--tier-color));
    background-size: 300% 300%;
  }

  .result-header {
    padding: 28px 24px 16px;
    position: relative;
    overflow: hidden;
  }
  .result-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--tier-gradient);
    opacity: 0.15;
  }

  .result-rarity {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--tier-color);
    color: var(--tier-color);
    margin-bottom: 14px;
    position: relative;
  }

  .result-mah {
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 4px;
    position: relative;
    background: var(--tier-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px var(--tier-glow));
  }
  .result-mah-unit {
    font-size: 18px;
    font-weight: 700;
    color: var(--tier-color);
    opacity: 0.8;
  }

  .result-battery-visual {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin: 16px 0;
  }
  .mini-bar {
    width: 24px;
    height: 8px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    transition: all 0.3s ease;
  }
  .mini-bar.filled {
    background: var(--tier-color);
    box-shadow: 0 0 8px var(--tier-glow);
  }

  .result-body {
    padding: 20px 24px;
  }
  .result-title {
    font-size: 18px;
    font-weight: 900;
    line-height: 1.4;
    margin-bottom: 12px;
    color: #fff;
  }
  .result-desc {
    font-size: 14px;
    line-height: 1.7;
    color: rgba(255,255,255,0.65);
    margin-bottom: 20px;
  }

  .result-divider {
    width: 40px;
    height: 2px;
    background: var(--tier-color);
    opacity: 0.4;
    margin: 0 auto 20px;
    border-radius: 1px;
  }

  /* Holographic shimmer overlay */
  .holo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      125deg,
      transparent 0%,
      rgba(255,255,255,0.03) 25%,
      rgba(255,255,255,0.08) 50%,
      rgba(255,255,255,0.03) 75%,
      transparent 100%
    );
    background-size: 200% 200%;
    animation: holoMove 3s ease infinite;
    pointer-events: none;
    border-radius: var(--card-radius);
    z-index: 2;
  }
  @keyframes holoMove {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  /* ============ SHARE BUTTONS ============ */
  .share-section {
    padding: 0 24px 28px;
  }
  .share-label {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .share-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .share-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .share-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
  }
  .share-btn svg { width: 16px; height: 16px; }

  .btn-retry {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn-retry:hover {
    border-color: rgba(255,255,255,0.3);
    color: #fff;
  }

  .btn-download {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--glow-cyan), #38a89d);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
    box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
  }
  .btn-download:active {
    transform: scale(0.97);
  }
  .btn-download svg { width: 18px; height: 18px; }

  /* ============ LOGO ============ */
  .logo-footer {
    margin-top: 20px;
    opacity: 0.4;
    transition: opacity 0.2s;
  }
  .logo-footer:hover { opacity: 0.6; }
  .logo-footer img {
    height: calc(100dvh * 0.05);
    max-height: 42px;
    min-height: 24px;
    width: auto;
    object-fit: contain;
    filter: brightness(2);
  }

  /* ============ BG PARTICLES ============ */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--glow-cyan);
    border-radius: 50%;
    opacity: 0;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    20% { opacity: 0.6; }
    80% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-10vh) scale(1); }
  }
</style>
</head>
<body>

<!-- Background particles -->
<div class="particles" id="particles"></div>

<!-- ====== SCREEN 1: COVER ====== -->
<div class="screen active" id="screen-cover">
  <div class="card-frame cover-card">
    <div class="cover-top">
      <div class="cover-badge">COS BATTERY TEST</div>

      <div class="battery-icon">
        <div class="battery-tip"></div>
        <div class="battery-body">
          <div class="battery-fill"></div>
          <span class="battery-lightning">&#9889;</span>
        </div>
      </div>

      <div class="cover-title">COS 最大電量<br>是多少？</div>
      <div class="cover-subtitle">10 題測出你的場次續航力</div>
    </div>
    <div class="cover-bottom">
      <div class="cover-taglines">
        每個場次都想去，但電量到底夠不夠？<br>
        你是傳說中的攪拌王？<br>
        還是電量低到去一小時就回家？
      </div>
      <button class="btn-start" onclick="startQuiz()">開 始 測 驗</button>
    </div>
  </div>
  <div class="logo-footer"><img src="logo.png" alt="COS'MATE"></div>
</div>

<!-- ====== SCREEN 2: QUESTIONS ====== -->
<div class="screen" id="screen-question">
  <div class="card-frame question-card">
    <div class="q-header">
      <span class="q-number" id="qNum">Q1 / 10</span>
      <div class="q-progress-bar">
        <div class="q-progress-fill" id="qProgress" style="width:10%"></div>
      </div>
    </div>
    <div class="q-body">
      <div class="q-text" id="qText"></div>
    </div>
    <div class="q-options" id="qOptions"></div>
  </div>
  <div class="logo-footer"><img src="logo.png" alt="COS'MATE"></div>
</div>

<!-- ====== SCREEN 3: LOADING ====== -->
<div class="screen" id="screen-loading">
  <div class="loading-content">
    <div class="loading-battery">
      <div class="battery-tip"></div>
      <div class="battery-body">
        <div class="battery-fill"></div>
      </div>
    </div>
    <div class="loading-text">正在計算你的電量...</div>
    <div class="loading-sub">偵測 COS 場次續航能力中</div>
  </div>
</div>

<!-- ====== SCREEN 4: RESULT ====== -->
<div class="screen" id="screen-result">
  <div class="card-frame result-card" id="resultCard">
    <div class="holo-overlay"></div>
    <div class="result-header">
      <div class="result-rarity" id="resultRarity"></div>
      <div class="result-mah" id="resultMah"></div>
      <div class="result-mah-unit">mAh</div>
      <div class="result-battery-visual" id="resultBars"></div>
    </div>
    <div class="result-body">
      <div class="result-title" id="resultTitle"></div>
      <div class="result-divider"></div>
      <div class="result-desc" id="resultDesc"></div>
    </div>
    <div class="share-section">
      <div class="share-label">分享你的電量</div>
      <div class="share-btns">
        <button class="share-btn" onclick="shareLine()">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
          LINE
        </button>
        <button class="share-btn" onclick="shareFB()">

const results = [

// ============ SCORING ============
// Segmented curve for 10 questions (score range 10–30)
function calculateMah(score) {
  if (score <= 14) return Math.round(1500 + (score - 10) * 500);     // 10→1500, 14→3500
  if (score <= 18) return Math.round(3800 + (score - 14) * 600);     // 15→4400, 18→6200
  if (score <= 23) return Math.round(6200 + (score - 18) * 500);     // 19→6700, 23→8700
  if (score <= 27) return Math.round(8700 + (score - 23) * 375);     // 24→9075, 27→10200
  return Math.round(10200 + (score - 27) * 600);                      // 28→10800, 30→12000
}

function getResult(mah) {
  for (let i = results.length - 1; i >= 0; i--) {
    if (mah >= results[i].range[0]) return results[i];
  }
  return results[0];
}

// ============ STATE ============
let currentQ = 0;
let totalScore = 0;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.remove('active');
  void el.offsetWidth; // trigger reflow for animation
  el.classList.add('active');
}

function startQuiz() {
  currentQ = 0;
  totalScore = 0;
  renderQuestion();
  showScreen('screen-question');
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qNum').textContent = `Q${currentQ + 1} / 10`;
  document.getElementById('qProgress').style.width = `${(currentQ + 1) * 10}%`;
  document.getElementById('qText').textContent = q.text;

  const container = document.getElementById('qOptions');
  container.innerHTML = '';
  const letters = ['A', 'B', 'C'];
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'q-option';
    div.innerHTML = `
      <span class="q-option-letter">${letters[i]}</span>
      <span class="q-option-text">${opt.label}</span>
    `;
    div.addEventListener('click', () => selectOption(opt.score, div));
    container.appendChild(div);
  });
}

function selectOption(score, el) {
  // Visual feedback
  document.querySelectorAll('.q-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');

  totalScore += score;

  setTimeout(() => {
    currentQ++;
    if (currentQ >= questions.length) {
      showLoading();
    } else {
      renderQuestion();
    }
  }, 350);
}

function showLoading() {
  showScreen('screen-loading');
  setTimeout(showResult, 2800);
}

function showResult() {
  const mah = calculateMah(totalScore);
  const r = getResult(mah);

  const card = document.getElementById('resultCard');
  card.setAttribute('data-tier', r.tier);

  document.getElementById('resultRarity').textContent = r.rarity;
  document.getElementById('resultMah').textContent = mah.toLocaleString();
  document.getElementById('resultTitle').textContent = r.title;
  document.getElementById('resultDesc').innerHTML = r.desc.replace(/\n/g, '<br>');

  // Battery bars
  const barsEl = document.getElementById('resultBars');
  barsEl.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const bar = document.createElement('div');
    bar.className = 'mini-bar' + (i < r.bars ? ' filled' : '');
    if (i < r.bars) bar.style.transitionDelay = `${i * 0.08}s`;
    barsEl.appendChild(bar);
  }

  showScreen('screen-result');
}

function restart() {

// ============ DOWNLOAD (Canvas API) ============
function downloadResult() {
  const btn = document.querySelector('.btn-download');
  btn.textContent = '產生中...';
  btn.disabled = true;

  try {
    const card = document.getElementById('resultCard');
    const tier = parseInt(card.getAttribute('data-tier'));
    const rarity = document.getElementById('resultRarity').textContent;
    const mah = document.getElementById('resultMah').textContent;
    const title = document.getElementById('resultTitle').textContent;
    const desc = document.getElementById('resultDesc').textContent;
    const r = results.find(x => x.tier === tier);

    const S = 2; // scale
    const W = 340 * S, RAD = 20 * S;
    // Dynamically calculate height based on content
    const headerH = 190 * S;
    const bodyPadTop = 20 * S, bodyPadBot = 24 * S;
    const titleFontSize = 18 * S, descFontSize = 14 * S;
    const lineHeight = descFontSize * 1.7;
    // Estimate desc lines
    const maxTextW = (340 - 48) * S;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    // Temp measure desc lines
    ctx.font = `${descFontSize}px "Noto Sans TC", sans-serif`;
    const descLines = wrapText(ctx, desc, maxTextW);
    const titleLines = wrapTextBold(ctx, title, maxTextW, titleFontSize);

    const bodyH = bodyPadTop + (titleLines.length * titleFontSize * 1.4) + 12*S + 2*S + 20*S + (descLines.length * lineHeight) + bodyPadBot;
    const footerH = 36 * S;
    const H = headerH + bodyH + footerH;

    canvas.width = W;
    canvas.height = H;

    // Tier colors
    const tierColors = {
      1: { color: '#8b9dc3', grad: ['#667eea', '#764ba2'] },
      2: { color: '#4ecdc4', grad: ['#11998e', '#38ef7d'] },
      3: { color: '#f7971e', grad: ['#f7971e', '#ffd200'] },
      4: { color: '#ff6b6b', grad: ['#ff6b6b', '#ee5a24'] },
      5: { color: '#a855f7', grad: ['#f093fb', '#f5576c'] }
    };
    const tc = tierColors[tier];

    // Background
    ctx.fillStyle = '#1a1a2e';
    roundRect(ctx, 0, 0, W, H, RAD);
    ctx.fill();

    // Header gradient overlay
    const hGrad = ctx.createLinearGradient(0, 0, W, headerH);
    hGrad.addColorStop(0, tc.grad[0]);
    hGrad.addColorStop(1, tc.grad[1]);
    ctx.save();
    roundRectTop(ctx, 0, 0, W, headerH, RAD);
    ctx.clip();
    ctx.fillStyle = hGrad;
    ctx.globalAlpha = 0.15;
    ctx.fillRect(0, 0, W, headerH);
    ctx.globalAlpha = 1;
    ctx.restore();

    // Rarity badge
    const badgeY = 32 * S;
    ctx.font = `bold ${11 * S}px "Noto Sans TC", sans-serif`;
    ctx.letterSpacing = `${2 * S}px`;
    const badgeW = ctx.measureText(rarity).width + 32 * S;
    const badgeX = (W - badgeW) / 2;
    ctx.strokeStyle = tc.color;
    ctx.lineWidth = 1.5 * S;
    roundRect(ctx, badgeX, badgeY, badgeW, 24 * S, 20 * S);
    ctx.stroke();
    ctx.fillStyle = tc.color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(rarity, W / 2, badgeY + 12 * S);
    ctx.letterSpacing = '0px';

    // mAh number (gradient text)
    const mahY = 88 * S;
    ctx.font = `900 ${52 * S}px "Noto Sans TC", sans-serif`;
    const mahGrad = ctx.createLinearGradient(W * 0.2, mahY - 30 * S, W * 0.8, mahY + 30 * S);
    mahGrad.addColorStop(0, tc.grad[0]);
    mahGrad.addColorStop(1, tc.grad[1]);
    ctx.fillStyle = mahGrad;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(mah, W / 2, mahY);

    // mAh unit
    ctx.font = `bold ${18 * S}px "Noto Sans TC", sans-serif`;
    ctx.fillStyle = tc.color;
    ctx.globalAlpha = 0.8;
    ctx.fillText('mAh', W / 2, mahY + 36 * S);
    ctx.globalAlpha = 1;

    // Battery bars
    const barW = 24 * S, barH = 8 * S, barGap = 4 * S;
    const totalBarW = 10 * barW + 9 * barGap;
    let barX = (W - totalBarW) / 2;
    const barY = 150 * S;
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i < r.bars ? tc.color : 'rgba(255,255,255,0.1)';
      roundRect(ctx, barX, barY, barW, barH, 2 * S);
      ctx.fill();
      if (i < r.bars) {
        ctx.shadowColor = tc.color;
        ctx.shadowBlur = 8 * S;
        roundRect(ctx, barX, barY, barW, barH, 2 * S);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      barX += barW + barGap;
    }

    // Body - Title
    let curY = headerH + bodyPadTop;
    ctx.font = `900 ${titleFontSize}px "Noto Sans TC", sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    titleLines.forEach(line => {
      ctx.fillText(line, W / 2, curY + titleFontSize * 0.5);
      curY += titleFontSize * 1.4;
    });

    // Divider
    curY += 6 * S;
    const divW = 40 * S;
    ctx.fillStyle = tc.color;
    ctx.globalAlpha = 0.4;
    ctx.fillRect((W - divW) / 2, curY, divW, 2 * S);
    ctx.globalAlpha = 1;
    curY += 2 * S + 16 * S;

    // Body - Description
    ctx.font = `${descFontSize}px "Noto Sans TC", sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    descLines.forEach(line => {
      ctx.fillText(line, W / 2, curY + descFontSize * 0.5);
      curY += lineHeight;
    });

    // Footer - COS'MATE text
    ctx.font = `bold ${10 * S}px "Noto Sans TC", sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText("COS'MATE", W / 2, H - 16 * S);

    // Border glow
    ctx.strokeStyle = tc.color;
    ctx.lineWidth = 3 * S;
    ctx.globalAlpha = 0.5;
    roundRect(ctx, 1.5 * S, 1.5 * S, W - 3 * S, H - 3 * S, RAD);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Download
    const link = document.createElement('a');
    link.download = 'COS電量測驗結果.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) {
    console.error('Download error:', e);
  }

  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下載結果卡';
  btn.disabled = false;
}

// Canvas helpers
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function roundRectTop(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, maxW) {
  const lines = [];
  // Split on explicit line breaks first
  text.split('\n').forEach(paragraph => {
    let line = '';
    for (const ch of paragraph) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = ch;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
  });
  return lines;
}

function wrapTextBold(ctx, text, maxW, fontSize) {
  ctx.save();
  ctx.font = `900 ${fontSize}px "Noto Sans TC", sans-serif`;
  const result = wrapText(ctx, text, maxW);
  ctx.restore();
  return result;
}

// ============ PARTICLES ============
(function initParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 6 + 's';
    p.style.animationDuration = (4 + Math.random() * 4) + 's';
    const colors = ['#4ecdc4', '#ff6b6b', '#ffe66d', '#a855f7'];
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    container.appendChild(p);
  }
})();
